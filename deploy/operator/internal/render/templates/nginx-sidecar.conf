user nginx;
worker_processes  2;
error_log  /dev/stdout;
events {
    worker_connections  1024;
}
http {
    server
    {
        server_tokens off;

        listen {{ .Listen }} ssl;
        listen [::]:{{ .Listen }} ssl;
        http2  on;

        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;

        # HSTS (15768000 seconds = 6 months)
        add_header Strict-Transport-Security max-age=15768000;

        client_max_body_size 1G;

        access_log /dev/stdout;
        error_log  /dev/stdout;

        location / {
            proxy_cache         off;

            proxy_set_header    Upgrade $http_upgrade;
            proxy_set_header    Connection "Upgrade";
            proxy_http_version  1.1;
            # large uploads, like the images of ryokan, are streamed to the component instead of
            # being buffered in the sidecar, whose memory is limited
            proxy_request_buffering off;
            proxy_set_header    Host                $http_host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;

            proxy_pass http://127.0.0.1:{{ .Upstream }}/;
            proxy_read_timeout 180;
            {{- if .RedirectDomain }}
            proxy_redirect http://127.0.0.1:{{ .Upstream }} https://{{ .RedirectDomain }};
            {{- end }}
        }
    }
    {{- if .HTTPRedirect }}

    server
    {
        listen 8080;
        server_tokens off;
        server_name {{ .RedirectDomain }};
        return 301 https://$host$request_uri;
    }
    {{- end }}
}
