apiVersion: v1
kind: Namespace
metadata:
  name: ainari-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ainari-operator
  labels:
    app: ainari-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ainari-operator
  template:
    metadata:
      labels:
        app: ainari-operator
    spec:
      serviceAccountName: ainari-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: operator
          args:
            - --leader-elect
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
