# Ainari-resource of the kind-setup of testing/kind/setup_kind_stack.sh: the images of the local
# build, two sakura-hosts and the api of every component on a node-port, without gateway and
# wireguard.
# All keys and passwords are generated by the operator. Only the passphrase of the test-user is
# fixed: testing/kind/setup_kind_stack.sh creates the secret 'miko-admin' with it, before it
# creates this resource, and the operator never replaces an existing secret.
apiVersion: ainari.cloud/v1alpha1
kind: Ainari
metadata:
  name: ainari
spec:
  global:
    # there is no gateway, the api and the dashboard are published over node-ports
    gateway:
      enabled: false
    # The CA is created once by testing/kind/setup_kind_stack.sh and stays the same over all
    # runs, so it only has to be trusted once. The api is reached over 127.0.0.1 from the host.
    certificates:
      caSecret: ainari-kind-ca
      extraDnsNames:
        - localhost
      extraIpAddresses:
        - 127.0.0.1
    wireguard:
      enabled: false
    # there is only one node
    strictScheduling: false
    # local test-setup, so the debug-logs are enabled
    debug: true
    # the storage-class of the local-path-provisioner of kind
    storageClass: standard
    # the images are built locally and loaded into kind, they can not be pulled
    imagePullPolicy: IfNotPresent
    externalServices:
      enabled: true
      type: NodePort
      nodePortOffset: 20000

  miko:
    image: ainari/miko:local
    publicAddress: https://127.0.0.1:11417
    # the same test-login, which the cli and the other tests use, see the secret 'miko-admin'
    admin:
      id: asdf
      name: asdf

  hanami:
    image: ainari/hanami:local
    publicAddress: https://127.0.0.1:11418

  ryokan:
    image: ainari/ryokan:local
    publicAddress: https://127.0.0.1:11416

  omamori:
    image: ainari/omamori:local
    publicAddress: https://127.0.0.1:11421

  omikuji:
    image: ainari/omikuji:local
    publicAddress: https://127.0.0.1:11424

  izakaya:
    image: ainari/izakaya:local

  # two onsen, each with its own volume, which register themselves at ryokan with their own
  # address, so the images are spread over both
  onsen:
    replicas: 2
    image: ainari/onsen:local

  # two sakura-hosts, so a virtual machine can land on either of them and the traffic between
  # them really crosses the gateway at the edge
  sakura:
    replicas: 2
    image: ainari/sakura:local
    # has to be the group of /dev/kvm within the node
    kvmGid: 103

  torii:
    image: ainari/torii:local
    # The api of torii is only reachable within the cluster.
    publicAddress: https://127.0.0.1:11419
    serviceType: NodePort
    # Every virtual machine is reachable as https://<vm-uuid>.ainari.localhost:10042, which
    # resolves to 127.0.0.1 without any DNS-entry. The port has to match the extraPortMappings in
    # testing/kind/cluster.yaml.
    proxy:
      domain: ainari.localhost
      port: 10042
    public:
      # the veth-pair towards the host is moved into the pod by testing/kind/setup_kind_stack.sh
      waitForIface: veth-gw

  dashboard:
    image: ainari/dashboard:local
