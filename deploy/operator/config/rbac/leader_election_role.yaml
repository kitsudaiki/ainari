# permissions of the leader-election in the namespace of the operator
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ainari-operator-leader-election
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ainari-operator-leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ainari-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: ainari-operator
    namespace: ainari-system
