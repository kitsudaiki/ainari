# Gateway of the gateway-api, which publishes the apis and the dashboard of ainari. The operator
# attaches a TLSRoute for the domain of every component to the listener 'tls-passthrough'. The
# listener doesn't terminate tls, it only routes the connections by their SNI to the
# nginx-sidecars of the components, which terminate tls with the certificates of cert-manager.
# The listener 'http' redirects all plain http-requests to https.
#
# The GatewayClass is the one of Envoy Gateway. For another implementation of the gateway-api,
# which supports TLSRoutes with the mode Passthrough, the GatewayClass has to be replaced by the
# one of this implementation.

---

apiVersion: v1
kind: Namespace
metadata:
  name: ainari-gateway

---

apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: ainari
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

---

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ainari-gateway
  namespace: ainari-gateway
spec:
  gatewayClassName: ainari
  listeners:
    - name: tls-passthrough
      protocol: TLS
      port: 443
      tls:
        mode: Passthrough
      allowedRoutes:
        # the TLSRoutes are within the namespace of the Ainari-resource
        namespaces:
          from: All
        kinds:
          - kind: TLSRoute
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: ainari-gateway
spec:
  parentRefs:
    - name: ainari-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
