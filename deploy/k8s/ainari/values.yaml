# settings, which apply to all components
global:
  # Every component is reachable over an ingress of ingress-nginx. The components always talk
  # https to each other, over a nginx-sidecar with a certificate of cert-manager, so cert-manager
  # is always required.
  ingress:
    enabled: true
  # All certificates are signed by one CA, so a client only has to trust this CA.
  certificates:
    # Name of a secret of the type kubernetes.io/tls with the certificate and key of an own CA.
    # If empty, cert-manager creates a CA in the secret 'ainari-ca'.
    ca_secret: ""
    # additional names and addresses, which every certificate is valid for
    extra_dns_names: []
    extra_ip_addresses: []
  # The connection between ryokan, onsen and sakura runs through wireguard. The secrets are
  # created by deploy/k8s/wg_gen.py.
  wireguard:
    enabled: true
  # Every component runs only on the nodes with its label (for example 'hanami-node=true') and
  # never twice on the same node. A cluster with only one node needs this to be disabled.
  strict_scheduling: true
  # overwrites the storage-class of all components, if set
  storage_class: ""
  image:
    # overwrites the pull-policy of all components, if set
    pull_policy: ""
  # Publishes the api of every component and the dashboard outside of the cluster, beside the
  # ingresses.
  external_services:
    enabled: false
    # NodePort publishes the api on the node-port, which is the port of the component plus
    # node_port_offset, for example 11417 + 20000 = 31417 for miko. LoadBalancer publishes it on
    # the port of the component itself, for example on the nodes with the servicelb of k3s.
    type: NodePort
    node_port_offset: 20000


secrets:
  internal_api_key: "my-super-secret-api-key"
  onsen_registration_key: "my-super-secret-api-key"
  sakura_registration_key: "my-super-secret-api-key"
  # Ed25519 key-pair, with which hanami signs the membership-grants of the MLS-groups of the
  # networks (see hanami.network.mls_encryption). Both are base64-encoded: the private key as its
  # 32 byte seed, the public key as its 32 bytes. hanami logs the public key, which belongs to
  # its private key, at its start. They have no default on purpose, a well-known key would let
  # anyone join the groups. Required, as long as the encryption is enabled.
  mls_grant_signing_key: ""
  mls_grant_public_key: ""


# Database of miko, hanami, ryokan and omamori. Each of them has its own database and user on the
# same mysql-server, so all their replicas share their state.
mysql:
  # Deploys a mysql-server into the cluster, which runs on the node with the label
  # 'mysql-node=true' (see global.strict_scheduling). If disabled, an already existing server is
  # used, which is reached at 'host' and already has the databases and users below.
  deploy: true
  # address of the external server, only used if 'deploy' is disabled
  host: ""
  port: 3306
  docker:
    tag: "8.4"
    repository: "mysql"
    pull_policy: "IfNotPresent"
  storage:
    storage_class: local-path
    size: 5Gi
  # password of the root-user of the deployed server
  root_password: "my-super-secret-root-password"
  # Database, user and password of every component. The names may only contain letters, digits
  # and underscores.
  databases:
    miko:
      database: "miko"
      user: "miko"
      password: "my-super-secret-miko-password"
    hanami:
      database: "hanami"
      user: "hanami"
      password: "my-super-secret-hanami-password"
    ryokan:
      database: "ryokan"
      user: "ryokan"
      password: "my-super-secret-ryokan-password"
    omamori:
      database: "omamori"
      user: "omamori"
      password: "my-super-secret-omamori-password"
    izakaya:
      database: "izakaya"
      user: "izakaya"
      password: "my-super-secret-izakaya-password"


miko:
  replica_count: 1
  docker:
    tag: "develop"
    repository: "kitsudaiki/miko"
    pull_policy: "Always"
  api:
    domain: local-miko
    # address, which is handed out to the clients. Derived from the domain, if empty.
    public_address: ""
  user:
    id: ""
    name: ""
    passphrase: ""
  token:
    data: ""
    expire_time: 3600


hanami:
  replica_count: 1
  docker:
    tag: "develop"
    repository: "kitsudaiki/hanami"
    pull_policy: "Always"
  api:
    domain: local-hanami
    # address, which is handed out to the clients. Derived from the domain, if empty.
    public_address: ""
  network:
    # range of the floating ip-addresses, which are served by the torii at the edge
    floating_ip_cidr: "10.0.0.0/24"
    # Encrypts the traffic between the virtual machines of a network on different hosts with
    # IPsec, whose keys the gateways exchange over MLS-groups, which izakaya coordinates. Requires
    # secrets.mls_grant_signing_key and secrets.mls_grant_public_key.
    mls_encryption: true
    # seconds, for which a membership-grant allows a gateway to join the group of a network
    mls_grant_validity: 86400
    # seconds between two refreshes of all membership-grants
    mls_grant_refresh_interval: 300


sakura:
  replica_count: 1
  docker:
    tag: "develop"
    repository: "kitsudaiki/sakura"
    pull_policy: "Always"
  api:
    domain: local-sakura
  processing:
    max_number_of_threads: 0
  # Id of the group, which owns /dev/kvm on the nodes. Sakura runs as a normal user and needs it
  # to open the virtual machines.
  kvm_gid: 993
  # Directory on the node, which holds the data of the sakura-host and of the gateway in front of
  # it: their databases and the disks of the virtual machines. Every pod gets its own
  # subdirectory '<pod-name>/sakura' and '<pod-name>/torii', so the data stays on the node and
  # survives a restart of the pod, also with several pods on one node, like in the kind-setup.
  host_data_path: /etc/ainari


ryokan:
  replica_count: 1
  docker:
    tag: "develop"
    repository: "kitsudaiki/ryokan"
    pull_policy: "Always"
  api:
    domain: local-ryokan
    # address, which is handed out to the clients. Derived from the domain, if empty.
    public_address: ""


omamori:
  replica_count: 1
  docker:
    tag: "develop"
    repository: "kitsudaiki/omamori"
    pull_policy: "Always"
  api:
    domain: local-omamori
    # address, which is handed out to the clients. Derived from the domain, if empty.
    public_address: ""


# Shares the MLS key-packages of the gateways, delivers their MLS-messages and coordinates the
# changes and key-rotations of the groups. It keeps its state in the mysql-server, so it can run
# with several replicas. Only the other components talk to it, so it has no external api.
izakaya:
  replica_count: 1
  docker:
    tag: "develop"
    repository: "kitsudaiki/izakaya"
    pull_policy: "Always"
  api:
    domain: local-izakaya
  # seconds between two key-rotations of a group, whose membership didn't change
  key_rotation_interval: 3600
  # seconds without contact, after which a gateway is removed from its groups, for example the
  # gateway of a sakura-host, which came back in a new pod with a new address
  member_timeout: 120


onsen:
  replica_count: 1
  docker:
    tag: "develop"
    repository: "kitsudaiki/onsen"
    pull_policy: "Always"
  storage:
    storage_class: local-path
  api:
    domain: local-onsen


torii:
  replica_count: 1
  docker:
    tag: "develop"
    repository: "kitsudaiki/torii"
    pull_policy: "Always"
  storage:
    storage_class: local-path
  api:
    domain: local-torii
    # address, which is handed out to the clients. Derived from the domain, if empty.
    public_address: ""
  service:
    type: LoadBalancer
  port_range:
    start: 10040
    end: 10050
  # The gateway at the edge of the network. It serves the floating ip-addresses on its uplink.
  public:
    network:
      overlay_iface: "veth-gw"
      uplink_iface: "veth-gw"
      # address of the next hop behind the uplink
      uplink_next_hop: "10.0.0.1"
    # Name of an interface, which is moved into the pod from the outside (for example by
    # testing/kind/setup_kind_stack.sh). The gateway waits for it, before it starts. Empty, if the
    # uplink is already there.
    wait_for_iface: ""


dashboard:
  enabled: true
  replica_count: 1
  docker:
    tag: "develop"
    repository: "kitsudaiki/ainari_dashboard"
    pull_policy: "Always"
  storage:
    storage_class: local-path
  api:
    domain: local-ainari



resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
