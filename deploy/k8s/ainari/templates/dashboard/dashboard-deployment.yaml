{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    app: dashboard
spec:
  replicas: {{ .Values.dashboard.replica_count }}
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      {{- include "ainari.affinity" (list . "dashboard" "ainari-dashboard-node") | nindent 6 }}
      containers:
      - name: dashboard
        image: {{ include "ainari.image" .Values.dashboard }}
        imagePullPolicy: {{ include "ainari.pullPolicy" (list . .Values.dashboard) }}
        readinessProbe:
          # the dashboard only listens on localhost, so it is asked over its tls-termination
          httpGet:
            path: /
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          # the dashboard only listens on localhost, so it is asked over its tls-termination
          httpGet:
            path: /
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3
        volumeMounts:
        - name: dashboard-config
          mountPath: /usr/share/nginx/html/config.json
          subPath: config.json
          readOnly: true
        - name: dashboard-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true


      - name: tls-termination
        image: nginx:latest
        volumeMounts:
        - name: tls-certs
          mountPath: /etc/nginx/certs
        - name: dashboard-nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"

      volumes:
        - name: tls-certs
          secret:
            secretName: dashboard-tls-secret
        - name: dashboard-nginx-config
          configMap:
            name: dashboard-nginx-config
        - name: dashboard-config
          configMap:
            name: dashboard-config
{{- end }}
