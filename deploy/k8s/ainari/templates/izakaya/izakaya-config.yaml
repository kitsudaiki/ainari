{{- if .Values.hanami.network.mls_encryption }}
apiVersion: v1
metadata:
  name: izakaya-config
data:
  izakaya.toml: |+
    debug = true
    log_path = ""
    database_type = "mysql"
    skip_tls_verification = true

    [api]
    public_ip = "127.0.0.1"
    public_port = 11423
    internal_ip = "127.0.0.1"
    internal_port = 10423

    {{ include "ainari.mysqlConfig" (list . "izakaya") | indent 4 | trim }}

    [miko]
    address = "{{ include "ainari.mikoAddress" . }}"

    [mls]
    grant_public_key = "{{ include "ainari.mlsGrantPublicKey" . }}"
    key_rotation_interval = {{ .Values.izakaya.key_rotation_interval }}

kind: ConfigMap
{{- end }}
