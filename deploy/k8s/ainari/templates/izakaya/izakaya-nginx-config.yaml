{{- if .Values.hanami.network.mls_encryption }}
# Only the other components talk to izakaya, so there is only the tls-termination of its internal
# api, which listens on 8443 for izakaya-tls-service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: izakaya-nginx-config
data:
  internal.conf: |+
    {{- include "ainari.nginxConfig" (list 8443 10423) | nindent 4 }}
{{- end }}
