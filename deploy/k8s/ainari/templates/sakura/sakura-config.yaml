# @HOSTNAME@ is replaced by the name of the pod, when it starts. Hanami uses this address to talk
# to sakura and derives the torii, which owns the TAP-devices of the virtual machines of this host,
# from it, because both share the pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sakura-config
data:
  sakura.toml: |+
    debug = true
    log_path = ""
    skip_tls_verification = true
    address = "https://@HOSTNAME@.sakura.{{ .Release.Namespace }}.svc.cluster.local:8443"

    [processing]
    max_number_of_threads = {{ .Values.sakura.processing.max_number_of_threads }}

    [storage]
    local_vm_storage_path = "/etc/ainari/sakura/virtual_machines"
    tempfile_location = "/tmp/sakura"

    [api]
    public_ip = "127.0.0.1"
    public_port = 11420
    internal_ip = "127.0.0.1"
    internal_port = 10420

    [database]
    file_path = "/etc/ainari/sakura/sakura_db"

    [miko]
    address = "{{ include "ainari.mikoAddress" . }}"

    [host]
    reserved_cores = 0
    reserved_memory = 0
    reserved_disk = 0
