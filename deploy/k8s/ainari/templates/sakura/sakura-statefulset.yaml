# Every pod is one sakura-host together with the gateway in front of it. Both share the
# network-namespace of the pod, so cloud-hypervisor can attach the virtual machines to the
# TAP-devices of that gateway.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sakura
  labels:
    app: sakura
spec:
  serviceName: sakura
  replicas: {{ .Values.sakura.replica_count }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: sakura
  template:
    metadata:
      labels:
        app: sakura
    spec:
      {{- include "ainari.affinity" (list . "sakura" "sakura-node") | nindent 6 }}
      {{- include "ainari.waitForMiko" . | nindent 6 }}
      # The directories of the pod on the node are created by the kubelet as root, but sakura runs
      # as a normal user, so they are prepared for it first. The owner is set by name, so it fits
      # every variant of the image.
      - name: prepare-host-data
        image: {{ include "ainari.image" .Values.sakura }}
        imagePullPolicy: {{ include "ainari.pullPolicy" (list . .Values.sakura) }}
        securityContext:
          runAsUser: 0
        command:
        - /bin/sh
        - -c
        - >-
          mkdir -p /host-data/torii /host-data/sakura/virtual_machines &&
          chown ainari:ainari /host-data/sakura /host-data/sakura/virtual_machines
        env:
        {{- include "ainari.podNameEnv" . | nindent 8 }}
        volumeMounts:
        - name: host-data
          mountPath: /host-data
          subPathExpr: $(POD_NAME)
      securityContext:
        # sakura runs as a normal user and opens the virtual machines over /dev/kvm
        supplementalGroups:
        - {{ .Values.sakura.kvm_gid }}
      containers:
      # the gateway in front of this sakura-host, which owns the TAP-devices of its virtual
      # machines
      - name: torii
        image: {{ include "ainari.image" .Values.torii }}
        imagePullPolicy: {{ include "ainari.pullPolicy" (list . .Values.torii) }}
        command: ["/bin/bash", "/etc/ainari/scripts/start_torii.sh"]
        # the eBPF-datapath is attached to the interfaces of the pod and the TAP-devices are
        # created over /dev/net/tun
        securityContext:
          privileged: true
        env:
        - name: RUST_LOG
          value: "debug"
        - name: CONFIG_TEMPLATE
          value: /etc/ainari/templates/torii-vmm.toml
        - name: DEFAULT_GATEWAY_HOST
          value: torii-public.{{ .Release.Namespace }}.svc.cluster.local
        {{- include "ainari.podNameEnv" . | nindent 8 }}
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: internal-api-key
              key: internal_api_key
        volumeMounts:
        # The database of the gateway lies in the directory of the pod on the node, so a recreated
        # pod restores its TAP-devices, routes, packet-filters and MLS-state from it.
        - name: host-data
          mountPath: /etc/ainari/torii/
          subPathExpr: $(POD_NAME)/torii
        - name: torii-config
          mountPath: /etc/ainari/templates
          readOnly: true
        - name: torii-scripts
          mountPath: /etc/ainari/scripts
          readOnly: true
        - name: debugfs
          mountPath: /sys/kernel/debug
          readOnly: true
        readinessProbe:
          # torii only listens on localhost and its image has no curl, so it is asked over its
          # tls-termination, whose certificate is not verified by the kubelet
          httpGet:
            path: /v1alpha/is_ready
            port: 8444
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          # torii only listens on localhost and its image has no curl, so it is asked over its
          # tls-termination, whose certificate is not verified by the kubelet
          httpGet:
            path: /v1alpha/is_ready
            port: 8444
            scheme: HTTPS
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3

      - name: sakura
        image: {{ include "ainari.image" .Values.sakura }}
        imagePullPolicy: {{ include "ainari.pullPolicy" (list . .Values.sakura) }}
        # the config contains the address of this pod, which is only known, when it starts
        command:
        - /bin/sh
        - -c
        - >-
          mkdir -p /etc/ainari/sakura/virtual_machines &&
          sed "s/@HOSTNAME@/$HOSTNAME/g" /etc/ainari/templates/sakura.toml > /tmp/sakura.toml &&
          exec /home/ainari/start_sakura.sh
        # Kubernetes has no way to hand single devices like /dev/kvm and /dev/net/tun to a
        # container. Sakura still runs as a normal user, only cloud-hypervisor carries
        # CAP_NET_ADMIN as a file-capability.
        securityContext:
          privileged: true
        env:
        - name: CONFIG_FILE
          value: /tmp/sakura.toml
        - name: RUST_LOG
          value: "debug,h2=info"
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: internal-api-key
              key: internal_api_key
        - name: SAKURA_REGISTRATION_KEY
          valueFrom:
            secretKeyRef:
              name: sakura-registration-key
              key: sakura_retistration_key
        {{- include "ainari.podNameEnv" . | nindent 8 }}
        volumeMounts:
        # the database of sakura and the disks of the virtual machines lie in the directory of the
        # pod on the node
        - name: host-data
          mountPath: /etc/ainari/sakura/
          subPathExpr: $(POD_NAME)/sakura
        - name: sakura-config
          mountPath: /etc/ainari/templates
          readOnly: true
        {{- if .Values.global.wireguard.enabled }}
        - name: wg-secret
          mountPath: /etc/wireguard
          readOnly: true
        {{- end }}
        readinessProbe:
          exec:
            command:
            - curl
            - --fail
            - localhost:11420/v1alpha/is_ready
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - curl
            - --fail
            - localhost:11420/v1alpha/is_ready
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3

      # tls-termination of the internal api (8443) for hanami and of the external api (9443), which
      # the proxy-port of the torii at the edge forwards the clients to
      {{- include "ainari.tlsSidecars" "sakura" | nindent 6 }}

      # tls-termination of the torii in front of this sakura-host. Hanami reaches it on the same
      # port as the one of the gateway at the edge.
      - name: torii-tls-termination
        image: nginx:latest
        ports:
        - containerPort: 8444
        volumeMounts:
        - name: torii-tls-certs
          mountPath: /etc/nginx/certs
        - name: torii-nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          # Without requests, kubernetes reserves the limits for the sidecar, which would block
          # half a cpu per sidecar, although the tls-termination needs only a fraction of it.
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "500m"

      volumes:
        - name: sakura-config
          configMap:
            name: sakura-config
        - name: torii-config
          configMap:
            name: torii-config
        - name: torii-scripts
          configMap:
            name: torii-scripts
        - name: host-data
          hostPath:
            path: {{ .Values.sakura.host_data_path }}
            type: DirectoryOrCreate
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: tls-certs
          secret:
            secretName: sakura-tls-secret
        - name: sakura-nginx-config
          configMap:
            name: sakura-nginx-config
        - name: torii-tls-certs
          secret:
            secretName: torii-tls-secret
        - name: torii-nginx-config
          configMap:
            name: torii-nginx-config
        {{- if .Values.global.wireguard.enabled }}
        - name: wg-secret
          secret:
            secretName: wg-sakura-secret
        {{- end }}
