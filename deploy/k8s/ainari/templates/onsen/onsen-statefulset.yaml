apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: onsen
  labels:
    app: onsen
spec:
  serviceName: onsen
  replicas: {{ .Values.onsen.replica_count }}
  selector:
    matchLabels:
      app: onsen
  template:
    metadata:
      labels:
        app: onsen
    spec:
      {{- include "ainari.affinity" (list . "onsen" "onsen-node") | nindent 6 }}
      containers:
      - name: onsen
        image: {{ include "ainari.image" .Values.onsen }}
        imagePullPolicy: {{ include "ainari.pullPolicy" (list . .Values.onsen) }}
        # the config contains the address of this pod, which is only known, when it starts
        command:
        - /bin/sh
        - -c
        - sed "s/@HOSTNAME@/$HOSTNAME/g" /etc/ainari/templates/onsen.toml > /tmp/onsen.toml && exec /home/ainari/start_onsen.sh
        env:
        - name: CONFIG_FILE
          value: /tmp/onsen.toml
        - name: RUST_LOG
          value: "debug,h2=info"
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: internal-api-key
              key: internal_api_key
        - name: ONSEN_REGISTRATION_KEY
          valueFrom:
            secretKeyRef:
              name: onsen-registration-key
              key: onsen_retistration_key
        ports:
        - containerPort: 50051
          name: grpc
        # readinessProbe:
        #   tcpSocket:
        #     port: 50051
        #   initialDelaySeconds: 5
        #   periodSeconds: 10
        #   timeoutSeconds: 2
        #   successThreshold: 1
        #   failureThreshold: 3
        # livenessProbe:
        #   tcpSocket:
        #     port: 50051
        #   initialDelaySeconds: 15
        #   periodSeconds: 20
        #   timeoutSeconds: 2
        #   failureThreshold: 3
        volumeMounts:
        - name: data-volume
          mountPath: /etc/ainari/onsen/
        - name: onsen-config
          mountPath: /etc/ainari/templates
          readOnly: true
        {{- if .Values.global.wireguard.enabled }}
        - name: wg-secret
          mountPath: /etc/wireguard
          readOnly: true
        {{- end }}
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
              - SYS_MODULE

      volumes:
        - name: onsen-config
          configMap:
            name: onsen-config
        - name: data-volume
          persistentVolumeClaim:
            claimName: onsen-pvc
        {{- if .Values.global.wireguard.enabled }}
        - name: wg-secret
          secret:
            secretName: wg-onsen-secret
        {{- end }}
