apiVersion: v1
metadata:
  name: onsen-config
data:
  onsen.toml: |+
    debug = true
    log_path = ""
    skip_tls_verification = true
    {{- if .Values.global.wireguard.enabled }}
    address = "http://10.10.0.1:50051"
    {{- else }}
    # @HOSTNAME@ is replaced by the name of the pod, when it starts
    address = "http://@HOSTNAME@.onsen.{{ .Release.Namespace }}.svc.cluster.local:50051"
    {{- end }}

    [storage]
    location = "/etc/ainari/onsen/"
    
    [miko]
    address = "{{ include "ainari.mikoAddress" . }}"
    
kind: ConfigMap
