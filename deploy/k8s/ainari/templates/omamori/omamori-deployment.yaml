apiVersion: apps/v1
kind: Deployment
metadata:
  name: omamori
  labels:
    app: omamori
spec:
  replicas: {{ .Values.omamori.replica_count }}
  # Every node runs at most one replica of a component (see ainari.affinity), so an update can't
  # start an additional pod first. One old pod is removed, before its replacement is started.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: omamori
  template:
    metadata:
      labels:
        app: omamori
    spec:
      {{- include "ainari.affinity" (list . "omamori" "omamori-node") | nindent 6 }}
      {{- include "ainari.waitForMysql" . | nindent 6 }}
      containers:
      - name: omamori
        image: {{ include "ainari.image" .Values.omamori }}
        imagePullPolicy: {{ include "ainari.pullPolicy" (list . .Values.omamori) }}
        env:
        {{- include "ainari.mysqlPasswordEnv" "omamori" | nindent 8 }}
        - name: RUST_LOG
          value: "debug"
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: internal-api-key
              key: internal_api_key
        volumeMounts:
        - name: omamori-config
          mountPath: /etc/ainari/omamori.toml
          subPath: omamori.toml
          readOnly: true
        readinessProbe:
          exec:
            command:
            - curl
            - --fail
            - localhost:10421/v1alpha/is_ready
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - curl
            - --fail
            - localhost:10421/v1alpha/is_ready
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3

      - name: tls-termination
        image: nginx:latest
        volumeMounts:
        - name: tls-certs
          mountPath: /etc/nginx/certs
        - name: omamori-nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          # Without requests, kubernetes reserves the limits for the sidecar, which would block
          # half a cpu per sidecar, although the tls-termination needs only a fraction of it.
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "500m"

      volumes:
        - name: omamori-config
          configMap:
            name: omamori-config
        - name: tls-certs
          secret:
            secretName: omamori-tls-secret
        - name: omamori-nginx-config
          configMap:
            name: omamori-nginx-config
