{{- if .Values.mysql.deploy }}
# Script, which the mysql-image runs once at the first start with an empty data-directory. It
# creates the database and the user of every component. The tables are created by the components
# themselves with their migrations.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
data:
  create-databases.sh: |
    #!/bin/bash
    set -e

    # escapes a value for a string-literal of mysql, where backslash and quote are special
    sql_escape() {
        local value="${1//\\/\\\\}"
        echo "${value//\'/\\\'}"
    }

    {{- range $name := list "miko" "hanami" "ryokan" "omamori" }}
    {{- $db := include "ainari.mysqlDatabase" (list $ $name) | fromYaml }}

    mysql --protocol=socket -u root -p"${MYSQL_ROOT_PASSWORD}" <<EOSQL
    CREATE DATABASE IF NOT EXISTS {{ $db.database }};
    CREATE USER IF NOT EXISTS '{{ $db.user }}'@'%' IDENTIFIED BY '$(sql_escape "${{ upper $name }}_PASSWORD")';
    GRANT ALL PRIVILEGES ON {{ $db.database }}.* TO '{{ $db.user }}'@'%';
    EOSQL
    {{- end }}
{{- end }}
