{{- if .Values.mysql.deploy }}
# The database of miko, hanami, ryokan and omamori. It runs only once, because the data can't be
# shared between multiple instances of the server.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      {{- include "ainari.affinity" (list . "mysql" "mysql-node") | nindent 6 }}
      containers:
      - name: mysql
        image: {{ include "ainari.image" .Values.mysql }}
        imagePullPolicy: {{ include "ainari.pullPolicy" (list . .Values.mysql) }}
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: root_password
        {{- range $name := list "miko" "hanami" "ryokan" "omamori" }}
        # read by the init-script, which creates the user of {{ $name }}
        - name: {{ upper $name }}_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: {{ $name }}_password
        {{- end }}
        ports:
        - name: mysql
          containerPort: 3306
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        - name: mysql-init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        # The server only listens on the network, after the init-script has created the databases
        # and users, so the components can connect, as soon as it is ready.
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - mysqladmin ping --host=127.0.0.1 --connect-timeout=2 > /dev/null 2>&1
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - mysqladmin ping --host=127.0.0.1 --connect-timeout=2 > /dev/null 2>&1
          # the first start initializes the data-directory, which takes a while
          initialDelaySeconds: 120
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: mysql-init
        configMap:
          name: mysql-init
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: {{ include "ainari.storageClass" (list . .Values.mysql) }}
      resources:
        requests:
          storage: {{ .Values.mysql.storage.size }}
{{- end }}
