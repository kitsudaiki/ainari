{{- /* The wireguard-tunnel of ryokan has one key and one address, which can't be shared by
multiple replicas behind one service. */}}
{{- if and .Values.global.wireguard.enabled (gt (int .Values.ryokan.replica_count) 1) }}
{{- fail "ryokan.replica_count can only be greater than 1, if global.wireguard is disabled!" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ryokan
  labels:
    app: ryokan
spec:
  replicas: {{ .Values.ryokan.replica_count }}
  # Every node runs at most one replica of a component (see ainari.affinity), so an update can't
  # start an additional pod first. One old pod is removed, before its replacement is started.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ryokan
  template:
    metadata:
      labels:
        app: ryokan
    spec:
      {{- include "ainari.affinity" (list . "ryokan" "ryokan-node") | nindent 6 }}
      {{- include "ainari.waitForMysql" . | nindent 6 }}
      containers:
      - name: ryokan
        image: {{ include "ainari.image" .Values.ryokan }}
        imagePullPolicy: {{ include "ainari.pullPolicy" (list . .Values.ryokan) }}
        env:
        {{- include "ainari.mysqlPasswordEnv" "ryokan" | nindent 8 }}
        - name: RUST_LOG
          value: "debug,h2=info"
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: internal-api-key
              key: internal_api_key
        - name: ONSEN_REGISTRATION_KEY
          valueFrom:
            secretKeyRef:
              name: onsen-registration-key
              key: onsen_retistration_key
        volumeMounts:
        - name: ryokan-config
          mountPath: /etc/ainari/ryokan.toml
          subPath: ryokan.toml
          readOnly: true
        {{- if .Values.global.wireguard.enabled }}
        - name: wg-secret
          mountPath: /etc/wireguard
          readOnly: true
        {{- end }}
        securityContext:
          seccompProfile: 
            type: RuntimeDefault
          capabilities:
            add:
              - NET_ADMIN
              - SYS_MODULE
        readinessProbe:
          exec:
            command:
            - curl
            - --fail
            - localhost:10416/v1alpha/is_ready
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - curl
            - --fail
            - localhost:10416/v1alpha/is_ready
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3
                

      {{- include "ainari.tlsSidecars" "ryokan" | nindent 6 }}

      volumes:
        - name: ryokan-config
          configMap:
            name: ryokan-config
        - name: tls-certs
          secret:
            secretName: ryokan-tls-secret
        - name: ryokan-nginx-config
          configMap:
            name: ryokan-nginx-config
        {{- if .Values.global.wireguard.enabled }}
        - name: wg-secret
          secret:
            secretName: wg-ryokan-secret
        {{- end }}
