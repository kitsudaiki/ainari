apiVersion: apps/v1
kind: Deployment
metadata:
  name: miko
  labels:
    app: miko
spec:
  replicas: {{ .Values.miko.replica_count }}
  # Every node runs at most one replica of a component (see ainari.affinity), so an update can't
  # start an additional pod first. One old pod is removed, before its replacement is started.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: miko
  template:
    metadata:
      labels:
        app: miko
    spec:
      {{- include "ainari.affinity" (list . "miko" "miko-node") | nindent 6 }}
      {{- include "ainari.waitForMysql" . | nindent 6 }}
      containers:
      - name: miko
        image: {{ include "ainari.image" .Values.miko }}
        imagePullPolicy: {{ include "ainari.pullPolicy" (list . .Values.miko) }}
        env:
        {{- include "ainari.mysqlPasswordEnv" "miko" | nindent 8 }}
        - name: AINARI_ADMIN_ID
          value: {{ required "user.id is required!" .Values.miko.user.id }}
        - name: AINARI_ADMIN_NAME
          value: {{ required "user.name is required!" .Values.miko.user.name }}
        - name: AINARI_ADMIN_PASSPHRASE
          value: {{ required "user.passphrase is required!" .Values.miko.user.passphrase }}
        - name: RUST_LOG
          value: "debug"
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: internal-api-key
              key: internal_api_key
        volumeMounts:
        - name: miko-config
          mountPath: /etc/ainari/miko.toml
          subPath: miko.toml
          readOnly: true
        - name: token-key
          mountPath: /etc/ainari/token_key
          subPath: token-key
          readOnly: true
        readinessProbe:
          exec:
            command:
            - curl
            - --fail
            - localhost:10417/v1alpha/is_ready
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - curl
            - --fail
            - localhost:10417/v1alpha/is_ready
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3

      {{- include "ainari.tlsSidecars" "miko" | nindent 6 }}

      volumes:
        - name: miko-config
          configMap:
            name: miko-config
        - name: token-key
          secret:
            secretName: token-key
        - name: tls-certs
          secret:
            secretName: miko-tls-secret
        - name: miko-nginx-config
          configMap:
            name: miko-nginx-config
