apiVersion: v1
metadata:
  name: miko-config
data:
  miko.toml: |+
    debug = true
    log_path = ""

    [auth]
    token_key_path = "/etc/ainari/token_key"
    token_expire_time = {{ .Values.miko.token.expire_time }}

    [api]
    public_ip = "127.0.0.1"
    public_port = 11417
    internal_ip = "127.0.0.1"
    internal_port = 10417

    [database]
    file_path = "/etc/ainari/miko/miko_db"

    [endpoints.hanami]
    public_address = "{{ include "ainari.publicAddress" (list . "hanami") }}"
    internal_address = "{{ include "ainari.internalAddress" (list . "hanami") }}"

    [endpoints.ryokan]
    public_address = "{{ include "ainari.publicAddress" (list . "ryokan") }}"
    internal_address = "{{ include "ainari.internalAddress" (list . "ryokan") }}"

    # Hanami derives the torii of every sakura-host from this address, by replacing the host with
    # the one of the sakura-host and keeping the port, and compares the resolved addresses. So it
    # points to the headless service of the gateway at the edge, which resolves to the address of
    # the pod itself, and to port 8444, where the tls-termination of every torii listens.
    [endpoints.torii]
    public_address = "{{ include "ainari.publicAddress" (list . "torii") }}"
    internal_address = "https://torii-public.{{ .Release.Namespace }}.svc.cluster.local:8444"

    [endpoints.omamori]
    public_address = "{{ include "ainari.publicAddress" (list . "omamori") }}"
    internal_address = "{{ include "ainari.internalAddress" (list . "omamori") }}"

kind: ConfigMap
