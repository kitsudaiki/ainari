# Headless service of the gateway at the edge. It resolves to the address of the pod itself,
# because this address is the one, which the other gateways send their traffic to, and the one,
# which hanami compares with the addresses of the sakura-hosts. The address is published before
# the pod is ready, because the gateway only becomes ready, when its uplink is there.
apiVersion: v1
kind: Service
metadata:
  name: torii-public
  labels:
    app: torii-public
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: torii-public
  ports:
    - name: tls
      protocol: TCP
      port: 8444
      targetPort: 8444
---
{{- include "ainari.nodePortService" (list . "torii-public" (list (list 11419 8444))) }}
