# The CRD and the operator of deploy/operator/config/default with the image of the version of the
# zarf-package. The tag is a constant of zarf, which is replaced on deploy, so it is always the
# tag of the image within the package.
resources:
  - ../../operator/config/default

images:
  - name: kitsudaiki/ainari_operator
    newTag: "###ZARF_CONST_AINARI_VERSION###"
