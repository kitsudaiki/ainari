# Config of the second sakura-host for the local docker-compose setup.
#
# It is the config of the first host with another address: 'sakura-2' is the alias of the torii,
# whose network-namespace this host shares, in the dns of docker. Hanami uses this address to
# talk to sakura, to tell the two hosts apart and to find the torii, which owns the TAP-devices
# of the virtual machines of this host.
debug = true
log_path = "/var/log"
skip_tls_verification = true
address = "http://sakura-2:11420"

[api]
public_ip = "0.0.0.0"
public_port = 11420
internal_ip = "0.0.0.0"
internal_port = 10420

[database]
file_path = "/etc/ainari/sakura_db"

[miko]
address = "http://miko:11417"

[processing]
# 0 means there is no limitation
max_number_of_threads = 0

[storage]
local_vm_storage_path = "/etc/ainari/virtual_machines"
tempfile_location = "/tmp/sakura"

[host]
# nothing is reserved in the local setup, because all services share the same machine anyway
reserved_cores = 0
reserved_memory = 0
reserved_disk = 0

[hypervisor]
binary_path = "/usr/local/bin/cloud-hypervisor"
firmware_path = "/usr/local/share/CLOUDHV.fd"
