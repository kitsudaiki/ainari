name: Security badging sequence
description: |
  Publishes badges with the number of vulnerabilities per severity of the Docker-images and with
  the result of the vulnerability-check of the OpenSSF Scorecard
inputs:
  sarif_dir:
    description: Directory with the SARIF-files of Docker Scout, named '<component>.sarif.json'
    required: true
  github_token:
    description: The token to use to publish the changes
    required: true
  branch_name:
    description: Name of the branch to publish
    required: true
runs:
  using: composite
  steps:
    -
      name: Generate json with badges-information of Docker Scout
      run: |
        python3 ${{ github.action_path }}/generate_scout_badges.py ${{ inputs.sarif_dir }}
      shell: bash
    -
      name: Generate json with badges-information of OpenSSF Scorecard
      run: |
        python3 ${{ github.action_path }}/generate_scorecard_badges.py \
          github.com/${{ github.repository }}
      shell: bash
    -
      name: Push json-files to badges-repo
      # v4.0.0
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        personal_token: ${{ inputs.github_token }}
        external_repository: kitsudaiki/Ainari-badges
        publish_branch: ${{ inputs.branch_name }}
        publish_dir: ./badges
        # the badges of images, which were not scanned in this run, are kept
        keep_files: true
        user_name: "github-actions[bot]"
        user_email: "github-actions[bot]@users.noreply.github.com"
