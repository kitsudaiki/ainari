name: dockerhub-cleanup-untagged

# One-time cleanup of the untagged images on Docker Hub, which were left behind by the
# build-and-test workflow before it deleted the replaced images itself. The digests are read from
# the logs of the old workflow-runs, because Docker Hub provides no API to list untagged images.
# Run it first as dry-run and check the output, before running it with "delete" enabled.
# Don't run it while build-and-test pushes images, because these are untagged until the
# merge-job created the tag.

on:
  workflow_dispatch:
    inputs:
      delete:
        description: "Really delete the images (otherwise only a dry-run)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  cleanup:
    name: "Delete untagged images"
    runs-on: ubuntu-24.04
    steps:
      -
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: .github/scripts
      -
        name: Delete untagged images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 .github/scripts/dockerhub_cleanup_from_ci_logs.py \
            --workflow build_test.yml \
            --repositories kitsudaiki/hanami,kitsudaiki/miko,kitsudaiki/ryokan,kitsudaiki/izakaya,kitsudaiki/sakura,kitsudaiki/torii,kitsudaiki/omamori,kitsudaiki/omikuji,kitsudaiki/onsen,kitsudaiki/ainari_dashboard,kitsudaiki/ainari_operator,kitsudaiki/ainari_docs \
            ${{ inputs.delete && '--delete' || '' }}
