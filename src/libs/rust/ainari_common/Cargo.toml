[package]
name = "ainari_common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# connection-handling of the services, which support a sqlite- and a mysql-database. It links the
# client-library of mysql, so it is only enabled by these services.
mysql = ["diesel/mysql", "dep:diesel_migrations"]

[dependencies]
# logging
log = "0.4"
env_logger = "0.11"

# common
chrono = { version = "0.4", features = ["serde"] }

# hash
sha2 = "0.11.0"
hex = "0.4"

# constant-time comparison and wiping of secrets
subtle = "2.6"
zeroize = "1.9"

# encryption of in-memory data
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }

# key-derivation from passphrases
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.13"
rand = "0.10.1"

# encoding
base64 = "0.23"

# json
serde = { version = "1", features = ["derive", "serde_derive", "alloc"] }
serde_json = "1"
schemars = { package = "apistos-schemars", version = "0.8", features = ["chrono", "uuid1", "url", "rust_decimal"] }
validator = { version = "0.21", features = ["derive"] }

# url-encoding of the database-credentials
percent-encoding = "2.3"

# database-traits
diesel = { version = "2.3", features = ["sqlite"]}
diesel_migrations = { version = "2.3", optional = true }
uuid = { version = "1.23.1", features = ["v4"] }
