[package]
name = "miko"
version = "0.9.0"
edition = "2024"
rust-version = "1.85.1"

[dependencies]
ainari_common = { path = "../../libs/rust/ainari_common" }
ainari_api = { path = "../../libs/rust/ainari_api" }
ainari_api_structs = { path = "../../libs/rust/ainari_api_structs" }
# web-server
actix-web = "4"
actix-multipart = "0.7"
futures-util = "0.3"
tokio = { version = "1", features = ["fs"] }
actix-rt = "2.10"
# openapi-generator
schemars = { package = "apistos-schemars", version = "0.8", features = ["chrono", "uuid1", "url", "rust_decimal"] }
apistos = { version = "0.6", features = ["extras"] }
validator = { version = "0.21", features = ["derive"] }
# serialize
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
# jwt-token
# the aws_lc_rs backend is used instead of rust_crypto, because rust_crypto pulls in the `rsa`
# crate, which is affected by RUSTSEC-2023-0071 (Marvin timing attack) without any planned fix.
# exactly one of `aws_lc_rs` and `rust_crypto` must be enabled, otherwise jsonwebtoken can not
# determine a crypto-provider and panics at runtime instead of failing to compile.
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
# config-file
toml = "1.1"
# singleton (like used for the config-variable)
once_cell = "1.21"
# logger
log = "0.4"
env_logger = "0.11"
# database
diesel = { version = "2.3", features = ["sqlite", "uuid"] }
# common stuff
rand = "0.10.1"
lazy_static = "1.4"
chrono = "0.4.43"
futures = "0.3"
uuid = { version = "1.23.1", features = ["serde", "fast-rng", "v4"] }

[dev-dependencies]
serial_test = "3"
