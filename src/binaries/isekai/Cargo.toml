[package]
name = "isekai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ainari_common = { path = "../../libs/rust/ainari_common", features = ["mysql"] }
ainari_api = { path = "../../libs/rust/ainari_api" }
ainari_api_structs = { path = "../../libs/rust/ainari_api_structs" }
ainari_clients = { path = "../../libs/rust/ainari_clients" }
# web-server
actix-web = "4"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "time"] }
actix-rt = "2.10"
# openapi-generator
schemars = { package = "apistos-schemars", version = "0.8", features = ["chrono", "uuid1", "url", "rust_decimal"] }
apistos = { version = "0.9", features = ["extras"] }
validator = { version = "0.21", features = ["derive"] }
# serialize
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# config-file
toml = "1.1"
# singleton (like used for the config-variable)
once_cell = "1.21"
# logger
log = "0.4"
# database
diesel = { version = "2.3", features = ["sqlite", "uuid"] }
diesel_migrations = "2.3"
# common stuff
lazy_static = "1.4"
chrono = "0.4.43"
futures = "0.3"
uuid = { version = "1.23.1", features = ["serde", "fast-rng", "v4"] }
hex = "0.4.3"
base64 = "0.23"
# checksums and authentication of the manifest of a backup
sha2 = "0.11"
hmac = "0.13"
# wiping of keys after their usage
zeroize = "1.9"

[dev-dependencies]
serial_test = "4"
