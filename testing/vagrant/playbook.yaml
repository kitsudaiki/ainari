# Installs k3s on the virtual machines of testing/vagrant/Vagrantfile and deploys the helm-chart of
# deploy/k8s/ainari on it. It is run by vagrant once for all virtual machines, see
# scripts/setup_vagrant_stack.sh, which builds the images and the CA before.
#
# Groups:
#   management  the k3s-server, which also runs the control-components of ainari
#   torii       the gateway at the edge of the network
#   sakura      the sakura-hosts, each with the torii in front of it
#
# Only modules of ansible-core are used, so no collections have to be installed.

---
- name: Prepare all virtual machines
  hosts: all
  become: true
  tasks:
    - name: Install the tools of the gateways and the uplink
      ansible.builtin.apt:
        name:
          - ethtool
          - iptables
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Vagrant adds a management-interface with its own default route, so k3s would pick that
    # interface. The cluster has to use the private network instead, which has the bigger mtu.
    - name: Find the interface of the private network
      ansible.builtin.shell: |
        set -o pipefail
        ip -o -4 addr show | awk -v ip="{{ node_ip }}" '{ split($4, a, "/"); if (a[1] == ip) print $2 }'
      args:
        executable: /bin/bash
      register: private_iface
      changed_when: false
      failed_when: private_iface.stdout == ""


- name: Install the k3s-server
  hosts: management
  become: true
  tasks:
    - name: Install k3s as server
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          INSTALL_K3S_EXEC="server \
            --node-ip {{ node_ip }} \
            --flannel-iface {{ private_iface.stdout }} \
            --tls-san {{ node_ip }} \
            --disable traefik \
            --write-kubeconfig-mode 644" \
          sh -
      args:
        executable: /bin/bash
        creates: /usr/local/bin/k3s

    - name: Wait for the token of the cluster
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 180

    - name: Read the token of the cluster
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token


- name: Install the k3s-agents
  hosts: torii:sakura
  become: true
  vars:
    server: "{{ groups['management'][0] }}"
  tasks:
    - name: Install k3s as agent
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          K3S_URL="https://{{ hostvars[server].node_ip }}:6443" \
          K3S_TOKEN="{{ hostvars[server].k3s_token.content | b64decode | trim }}" \
          INSTALL_K3S_EXEC="agent \
            --node-ip {{ node_ip }} \
            --flannel-iface {{ private_iface.stdout }}" \
          sh -
      args:
        executable: /bin/bash
        creates: /usr/local/bin/k3s-agent-uninstall.sh


- name: Import the locally built images
  hosts: all
  become: true
  vars:
    images_of_group:
      management: [miko, omamori, ryokan, onsen, hanami, dashboard]
      torii: [torii]
      sakura: [sakura, torii]
    images: "{{ group_names | map('extract', images_of_group) | flatten | unique }}"
  tasks:
    - name: Create the directory for the images
      ansible.builtin.file:
        path: /opt/ainari/images
        state: directory
        mode: "0755"

    - name: Copy the images, which run on this node
      ansible.builtin.copy:
        src: "{{ repo_dir }}/temporary_files/vagrant/images/{{ item }}.tar"
        dest: "/opt/ainari/images/{{ item }}.tar"
        mode: "0644"
      loop: "{{ images }}"

    - name: Import the images into the containerd of k3s
      ansible.builtin.command: k3s ctr --namespace k8s.io images import "/opt/ainari/images/{{ item }}.tar"
      loop: "{{ images }}"
      changed_when: true


- name: Connect the gateway at the edge to the virtual machine ainari-torii
  hosts: torii
  become: true
  tasks:
    - name: Install the uplink-script
      ansible.builtin.copy:
        src: files/ainari-uplink.sh
        dest: /usr/local/bin/ainari-uplink.sh
        mode: "0755"
      register: uplink_script

    - name: Install the service of the uplink
      ansible.builtin.copy:
        dest: /etc/systemd/system/ainari-uplink.service
        mode: "0644"
        content: |
          [Unit]
          Description=Uplink of the gateway at the edge of the ainari-network
          After=k3s-agent.service
          Wants=k3s-agent.service

          [Service]
          ExecStart=/usr/local/bin/ainari-uplink.sh
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      register: uplink_service

    - name: Start the service of the uplink
      ansible.builtin.systemd_service:
        name: ainari-uplink
        enabled: true
        state: "{{ 'restarted' if (uplink_script.changed or uplink_service.changed) else 'started' }}"
        daemon_reload: true


- name: Deploy ainari
  hosts: management
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  vars:
    namespace: ainari
    release: ainari
    kvm_gid_host: "{{ groups['sakura'][0] }}"
  tasks:
    - name: Wait until all nodes are registered and ready
      ansible.builtin.shell: |
        set -o pipefail
        kubectl get nodes --no-headers | awk '$2 == "Ready"' | wc -l
      args:
        executable: /bin/bash
      register: ready_nodes
      retries: 60
      delay: 5
      until: ready_nodes.stdout | int == groups['all'] | length
      changed_when: false

    # Every component runs only on the nodes with its label (global.strict_scheduling).
    - name: Label the nodes
      ansible.builtin.command: >
        kubectl label node {{ item.0 }} {{ item.1 }}=true --overwrite
      loop: >-
        {{ groups['management'] | product(['miko-node', 'hanami-node', 'ryokan-node', 'omamori-node',
                                            'onsen-node', 'ainari-dashboard-node']) | list
           + groups['torii'] | product(['torii-node']) | list
           + groups['sakura'] | product(['sakura-node']) | list }}
      changed_when: true

    - name: Install helm
      ansible.builtin.unarchive:
        src: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        extra_opts: [--strip-components=1, linux-amd64/helm]
        creates: /usr/local/bin/helm

    - name: Install cert-manager
      ansible.builtin.command: >
        kubectl apply -f
        https://github.com/cert-manager/cert-manager/releases/download/{{ cert_manager_version }}/cert-manager.yaml
      register: cert_manager
      changed_when: "'created' in cert_manager.stdout or 'configured' in cert_manager.stdout"

    - name: Wait for cert-manager
      ansible.builtin.command: >
        kubectl --namespace cert-manager wait deployment --all --for=condition=Available --timeout=300s
      changed_when: false

    - name: Remove the helm-chart of a previous run
      ansible.builtin.file:
        path: /opt/ainari/ainari
        state: absent

    - name: Copy the helm-chart and its values
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0644"
        directory_mode: "0755"
      loop:
        - { src: "{{ repo_dir }}/deploy/k8s/ainari", dest: /opt/ainari/ }
        - { src: values.yaml, dest: /opt/ainari/values.yaml }

    - name: Copy the CA
      ansible.builtin.copy:
        src: "{{ repo_dir }}/temporary_files/vagrant/{{ item.name }}"
        dest: "/opt/ainari/{{ item.name }}"
        mode: "{{ item.mode }}"
      loop:
        - { name: ainari-vagrant-ca.crt, mode: "0644" }
        - { name: ainari-vagrant-ca.key, mode: "0600" }

    - name: Read the group of /dev/kvm on the sakura-hosts
      ansible.builtin.command: stat -c %g /dev/kvm
      delegate_to: "{{ kvm_gid_host }}"
      register: kvm_gid
      changed_when: false

    # The setup keeps no state on purpose, like the other local setups: every run starts with empty
    # databases and the new images, so a test never sees the virtual machines of a previous run.
    - name: Remove the previous deployment
      ansible.builtin.shell: |
        helm status --namespace {{ namespace }} {{ release }} > /dev/null 2>&1 \
          && helm uninstall --namespace {{ namespace }} {{ release }} --wait
        kubectl delete namespace {{ namespace }} --ignore-not-found --wait
      changed_when: true

    - name: Create the namespace with the CA
      ansible.builtin.shell: |
        kubectl create namespace {{ namespace }}
        kubectl --namespace {{ namespace }} create secret tls ainari-vagrant-ca \
          --cert /opt/ainari/ainari-vagrant-ca.crt --key /opt/ainari/ainari-vagrant-ca.key
      changed_when: true

    - name: Install the helm-chart
      ansible.builtin.command: >
        helm install {{ release }} /opt/ainari/ainari
        --namespace {{ namespace }}
        --values /opt/ainari/values.yaml
        --set sakura.kvm_gid={{ kvm_gid.stdout }}
      changed_when: true

    - name: Wait for the components
      ansible.builtin.command: >
        kubectl --namespace {{ namespace }} rollout status {{ item }} --timeout=600s
      loop:
        - deployment/miko
        - deployment/omamori
        - deployment/ryokan
        - deployment/hanami
        - deployment/dashboard
        - deployment/torii-public
        - statefulset/onsen
        - statefulset/sakura
      changed_when: false

    - name: Provide the kubeconfig for the host
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ repo_dir }}/temporary_files/vagrant/kubeconfig"
        flat: true

    - name: Point the kubeconfig of the host to the k3s-server
      ansible.builtin.replace:
        path: "{{ repo_dir }}/temporary_files/vagrant/kubeconfig"
        regexp: "https://127.0.0.1:6443"
        replace: "https://{{ node_ip }}:6443"
      delegate_to: localhost
      become: false
