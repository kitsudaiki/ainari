# Values of the vagrant-setup, which is started by scripts/setup_vagrant_stack.sh. The chart runs
# on a k3s-cluster of four virtual machines, so, unlike in the kind-setup, every component runs on
# the nodes with its label (strict_scheduling). The api of every component is published with its
# own port on the addresses of the nodes, for example miko on https://192.168.56.10:11417.

global:
  # there is no ingress-controller, the api and the dashboard are published by the servicelb of
  # k3s on every node, with the same ports as in the other local setups
  ingress:
    enabled: false
  external_services:
    enabled: true
    type: LoadBalancer
  # every component runs only on the virtual machines with its label, which ansible sets
  strict_scheduling: true
  # the storage-class of the local-path-provisioner of k3s
  storage_class: local-path
  image:
    # the images are built locally and imported into the nodes, they can not be pulled
    pull_policy: IfNotPresent
  wireguard:
    enabled: false
  # The CA is created once by scripts/setup_vagrant_stack.sh in temporary_files/vagrant and stays
  # the same over all runs. The api is reached over the addresses of the virtual machines.
  certificates:
    ca_secret: ainari-vagrant-ca
    extra_ip_addresses:
      - 192.168.56.10
      - 192.168.56.11
      - 192.168.56.12
      - 192.168.56.13


secrets:
  internal_api_key: "local-internal-api-key"
  onsen_registration_key: "local-onsen-registration-key"
  sakura_registration_key: "local-sakura-registration-key"


miko:
  docker:
    repository: "ainari/miko"
    tag: "local"
  api:
    public_address: "https://192.168.56.10:11417"
  # the same test-login, which the cli and the other tests use
  user:
    id: "asdf"
    name: "asdf"
    passphrase: "asdfasdf"
  token:
    data: "asdf"


hanami:
  docker:
    repository: "ainari/hanami"
    tag: "local"
  api:
    public_address: "https://192.168.56.10:11418"
  network:
    floating_ip_cidr: "10.0.0.0/24"


ryokan:
  docker:
    repository: "ainari/ryokan"
    tag: "local"
  api:
    public_address: "https://192.168.56.10:11416"


omamori:
  docker:
    repository: "ainari/omamori"
    tag: "local"
  api:
    public_address: "https://192.168.56.10:11421"


onsen:
  docker:
    repository: "ainari/onsen"
    tag: "local"


# one sakura-host on each of the two virtual machines with the label sakura-node
sakura:
  replica_count: 2
  docker:
    repository: "ainari/sakura"
    tag: "local"
  # set by the playbook to the group of /dev/kvm on the sakura-hosts
  kvm_gid: 992


torii:
  docker:
    repository: "ainari/torii"
    tag: "local"
  # The proxy-ports are published by the servicelb of k3s on every node. The clients connect to
  # the address of this public address with the proxy-port of a virtual machine.
  api:
    public_address: "https://192.168.56.11:11419"
  service:
    type: LoadBalancer
  port_range:
    start: 10042
    end: 10053
  public:
    network:
      overlay_iface: "veth-gw"
      uplink_iface: "veth-gw"
      uplink_next_hop: "10.0.0.1"
    # the veth-pair towards the virtual machine ainari-torii is moved into the pod by the service
    # ainari-uplink, which the playbook installs there
    wait_for_iface: "veth-gw"


dashboard:
  enabled: true
  docker:
    repository: "ainari/dashboard"
    tag: "local"
