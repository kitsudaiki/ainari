# Ainari-resource of the vagrant-setup, which is started by testing/vagrant/setup_vagrant_stack.sh
# and deployed by the operator of deploy/operator. The stack runs on a k3s-cluster of nine
# virtual machines, so, unlike in the kind-setup, every component runs on the nodes with its label
# (strictScheduling). Miko, hanami, ryokan, omamori, izakaya and the dashboard run with three
# replicas, one on each of the three management-nodes, which all share the mysql-server on its own
# node. The api of every component is published with its own port on the addresses of the nodes,
# for example miko on https://192.168.56.10:11417.
#
# All keys and passwords are generated by the operator. Only the passphrase of the test-user is
# fixed: the playbook creates the secret 'miko-admin' with it, before it creates this resource,
# and the operator never replaces an existing secret.
apiVersion: ainari.kitsunemimi.moe/v1alpha1
kind: Ainari
metadata:
  name: ainari
spec:
  global:
    # there is no ingress-controller, the api and the dashboard are published by the servicelb of
    # k3s on every node, with the same ports as in the other local setups
    ingress:
      enabled: false
    externalServices:
      enabled: true
      type: LoadBalancer
    # every component runs only on the virtual machines with its label, which ansible sets
    strictScheduling: true
    # the storage-class of the local-path-provisioner of k3s
    storageClass: local-path
    # the images are built locally and imported into the nodes, they can not be pulled
    imagePullPolicy: IfNotPresent
    wireguard:
      enabled: false
    # The CA is created once by testing/vagrant/setup_vagrant_stack.sh in temporary_files/vagrant
    # and stays the same over all runs. The api is reached over the addresses of the virtual
    # machines.
    certificates:
      caSecret: ainari-vagrant-ca
      extraIpAddresses:
        - 192.168.56.10
        - 192.168.56.11
        - 192.168.56.12
        - 192.168.56.13
        - 192.168.56.14
        - 192.168.56.15
        - 192.168.56.16
        - 192.168.56.17
        - 192.168.56.18

  # The mysql-server runs on the node with the label mysql-node, which is the virtual machine
  # ainari-mysql. Like the rest of the setup it starts empty with every run.

  miko:
    replicas: 3
    image: ainari/miko:local
    publicAddress: https://192.168.56.10:11417
    # the same test-login, which the cli and the other tests use, see the secret 'miko-admin'
    admin:
      id: asdf
      name: asdf

  hanami:
    replicas: 3
    image: ainari/hanami:local
    publicAddress: https://192.168.56.10:11418
    network:
      floatingIpCidr: 10.0.0.0/24

  ryokan:
    replicas: 3
    image: ainari/ryokan:local
    publicAddress: https://192.168.56.10:11416

  omamori:
    replicas: 3
    image: ainari/omamori:local
    publicAddress: https://192.168.56.10:11421

  izakaya:
    replicas: 3
    image: ainari/izakaya:local

  # one onsen on each of the two virtual machines with the label onsen-node, ainari-onsen and
  # ainari-onsen-2. Every one has its own volume and registers itself at ryokan with its own
  # address, so the images are spread over both.
  onsen:
    replicas: 2
    image: ainari/onsen:local

  # one sakura-host on each of the two virtual machines with the label sakura-node
  sakura:
    replicas: 2
    image: ainari/sakura:local
    # set by the playbook to the group of /dev/kvm on the sakura-hosts
    kvmGid: 992

  torii:
    image: ainari/torii:local
    # The proxy-ports are published by the servicelb of k3s on every node. The clients connect to
    # the host of this public address with the proxy-port of a virtual machine. The api of torii
    # itself is only reachable within the cluster.
    publicAddress: https://192.168.56.11:11419
    serviceType: LoadBalancer
    portRange:
      start: 10042
      end: 10053
    public:
      # the veth-pair towards the virtual machine ainari-torii is moved into the pod by the
      # service ainari-uplink, which the playbook installs there
      waitForIface: veth-gw

  # one replica of the dashboard on each of the three management-nodes, like the
  # control-components
  dashboard:
    replicas: 3
    image: ainari/dashboard:local
