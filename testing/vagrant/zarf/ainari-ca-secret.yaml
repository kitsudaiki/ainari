# CA of the setup, which signs the certificates of all components, see global.certificates.ca_secret
# in testing/vagrant/values.yaml. The values are set on deploy, see the variables of zarf.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: ainari-vagrant-ca
  namespace: ainari
type: kubernetes.io/tls
data:
  tls.crt: "###ZARF_VAR_CA_CRT###"
  tls.key: "###ZARF_VAR_CA_KEY###"
