# Cluster of the kind-setup, which is started by testing/kind/setup_kind_stack.sh.
#
# It has only one node, like the local docker-compose setup has only one host. The api of the
# components and the proxies of torii are published as node-ports (port + 20000, see
# global.externalServices in deploy/operator/config/samples/ainari_v1alpha1_ainari_kind.yaml) and
# mapped back to their original ports on the host, so the
# cli, the sdk and the tests reach the kind-setup at the same addresses as the docker-compose one.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ainari
nodes:
- role: control-plane
  extraPortMappings:
  # ryokan, miko, hanami, omamori and omikuji. The api of torii is only reachable within the
  # cluster.
  - {containerPort: 31416, hostPort: 11416, listenAddress: "127.0.0.1"}
  - {containerPort: 31417, hostPort: 11417, listenAddress: "127.0.0.1"}
  - {containerPort: 31418, hostPort: 11418, listenAddress: "127.0.0.1"}
  - {containerPort: 31421, hostPort: 11421, listenAddress: "127.0.0.1"}
  - {containerPort: 31424, hostPort: 11424, listenAddress: "127.0.0.1"}
  # dashboard
  - {containerPort: 31422, hostPort: 11422, listenAddress: "127.0.0.1"}
  # proxies of torii, which make the api of the sakura-hosts reachable from the host. All proxies
  # share this port, torii picks the proxy of a connection by its server name.
  - {containerPort: 30042, hostPort: 10042, listenAddress: "127.0.0.1"}
