# tls-termination of the external api of a sakura-host for the local docker-compose setup, like
# the nginx-sidecar of the kubernetes-setup. The proxies of torii-public don't terminate tls, they
# pick the sakura-host by the server name and forward the connection unchanged. So the clients
# get this certificate, which is only valid for *.ainari.localhost, the names of the proxies.
# testing/local_stack/setup_local_stack.sh creates it in temporary_files/local.
user nginx;
worker_processes  2;
error_log  /dev/stdout;
events {
    worker_connections  1024;
}
http {
    server
    {
        server_tokens off;

        listen 9443 ssl;
        http2  on;

        ssl_certificate /etc/nginx/certs/proxy.crt;
        ssl_certificate_key /etc/nginx/certs/proxy.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 1G;

        access_log /dev/stdout;

        location / {
            proxy_cache         off;

            proxy_set_header    Upgrade $http_upgrade;
            proxy_set_header    Connection "Upgrade";
            proxy_http_version  1.1;
            proxy_request_buffering off;
            proxy_set_header    Host                $http_host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;

            # the external api of the sakura-host in the same network-namespace
            proxy_pass http://127.0.0.1:11420/;
            proxy_read_timeout 180;
        }
    }
}
