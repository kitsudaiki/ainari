# Config of the second onsen of the local docker-compose setup, which is marked as backup-target
# by testing/local_stack/setup_local_stack.sh, so it only stores the backups of isekai.
debug = true
log_path = "/var/log"
skip_tls_verification = true
# the internal api, over which ryokan and the sakura-hosts reach this host
address = "http://onsen-backup:10426"

[api]
public_ip = "0.0.0.0"
public_port = 11426
internal_ip = "0.0.0.0"
internal_port = 10426

[miko]
address = "http://miko:11417"

[storage]
location = "/tmp/onsen"
