# Config of onsen for the local docker-compose setup.
debug = true
log_path = "/var/log"
skip_tls_verification = true
# the internal api, over which ryokan and the sakura-hosts reach this host
address = "http://onsen:10426"

[api]
public_ip = "0.0.0.0"
public_port = 11426
internal_ip = "0.0.0.0"
internal_port = 10426

[miko]
address = "http://miko:11417"

[storage]
# storage-backend of this onsen, only "local" at the moment
backend = "local"

[storage.local]
location = "/tmp/onsen"
