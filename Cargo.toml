[workspace]
members = [
    "src/binaries/sakura",
    "src/binaries/hanami",
    "src/binaries/miko", 
    "src/binaries/ryokan", 
    "src/binaries/torii", 
    "src/binaries/torii-ebpf", 
    "src/binaries/omamori", 
    "src/binaries/onsen", 
    "src/binaries/neko", 
    "src/libs/rust/torii_common", 
    "src/libs/rust/ainari_common",
    "src/libs/rust/ainari_files", 
    "src/libs/rust/ainari_api", 
    "src/libs/rust/ainari_hardware", 
    "src/libs/rust/ainari_clients", 
    "src/libs/rust/ainari_api_structs"
]
default-members = [
    "src/binaries/sakura",
    "src/binaries/hanami",
    "src/binaries/miko",
    "src/binaries/ryokan",
    "src/binaries/torii",
    "src/binaries/omamori",
    "src/binaries/onsen",
    "src/binaries/neko",
    "src/libs/rust/torii_common",
    "src/libs/rust/ainari_common",
    "src/libs/rust/ainari_files",
    "src/libs/rust/ainari_api",
    "src/libs/rust/ainari_hardware",
    "src/libs/rust/ainari_clients",
    "src/libs/rust/ainari_api_structs"
]
resolver = "2"

[workspace.dependencies]
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }
aya-log-ebpf = { version = "0.2.0", default-features = false }

anyhow = { version = "1", default-features = false }
cargo_metadata = { version = "0.23.0", default-features = false }
which = { version = "8.0.6", default-features = false }

[profile.release.package.torii-ebpf]
debug = 2
codegen-units = 1
strip = false


[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
panic = "abort"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 8
strip = true
panic = "abort"

# Faster variant of the release-profile for the local docker-compose-setup, which is rebuilt very
# often. It skips the link-time-optimization and compiles incrementally, so the binaries are a bit
# bigger and slower, but much faster to build.
[profile.local]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
