debug = true
# "stdout" or "log_file", the log-file is written into log_path
log_type = "stdout"
log_path = "/var/log/"
skip_tls_verification = true
# address of the internal api, which is registered at ryokan
address = "http://127.0.0.1:10426"

[api]
public_ip = "0.0.0.0"
public_port = 11426
internal_ip = "0.0.0.0"
internal_port = 10426

[miko]
address = "http://127.0.0.1:11417"

[storage]
# storage-backend of this onsen, only "local" at the moment
backend = "local"

[storage.local]
location = "/tmp/onsen"
# address and path of the NFS-export of "<location>/volumes", which the sakura-hosts mount;
# without these values the onsen doesn't support volumes
#nfs_server = "10.0.0.5"
#nfs_export = "/tmp/onsen/volumes"
