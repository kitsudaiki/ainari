debug = true
# "stdout" or "log_file", the log-file is written into log_path
log_type = "stdout"
log_path = "/var/log/"
# "sqlite" or "mysql", which selects the group below, which is used to connect to the database
database_type = "sqlite"
skip_tls_verification = true

[api]
public_ip = "0.0.0.0"
public_port = 11425
internal_ip = "0.0.0.0"
internal_port = 10425

# isekai also needs the internal address of miko for the project-lock and the export and import
# of the projects
[miko]
address = "http://127.0.0.1:11417"
internal_address = "http://127.0.0.1:10417"

[sqlite]
file_path = "/etc/ainari/isekai_db"

# the password is read from the env-variable AINARI_MYSQL_PASSWORD
#[mysql]
#host = "127.0.0.1"
#port = 3306
#user = "isekai"
#database = "isekai"

[processing]
# number of worker-threads, which process the backup- and restore-jobs
number_of_workers = 4
# maximum number of root-disks, which are saved at the same time on one sakura-host
max_parallel_snapshots = 2

# parameters of Argon2id, which derives the keys of a new backup from its passphrase. They are
# stored within each backup, so a change only affects new backups.
[kdf]
memory_kib = 65536
iterations = 3
parallelism = 4
