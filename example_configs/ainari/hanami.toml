debug = true
# "stdout" or "log_file", the log-file is written into log_path
log_type = "stdout"
log_path = "/var/log/"
# "sqlite" or "mysql", which selects the group below, which is used to connect to the database
database_type = "sqlite"
skip_tls_verification = true

[api]
public_ip = "0.0.0.0"
public_port = 11418
internal_ip = "0.0.0.0"
internal_port = 10418

[sqlite]
file_path = "/etc/ainari/hanami_db"

# the password is read from the env-variable AINARI_MYSQL_PASSWORD
#[mysql]
#host = "127.0.0.1"
#port = 3306
#user = "hanami"
#database = "hanami"

[miko]
address = "http://127.0.0.1:11417"

[network]
# range of the floating ip-addresses, which are handed out to the virtual machines
floating_ip_cidr = "10.0.0.0/24"
