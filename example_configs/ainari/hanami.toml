debug = true
# "stdout" or "log_file", the log-file is written into log_path
log_type = "stdout"
log_path = "/var/log/"
# "sqlite" or "mysql", which selects the group below, which is used to connect to the database
database_type = "sqlite"
skip_tls_verification = true

[api]
public_ip = "0.0.0.0"
public_port = 11418
internal_ip = "0.0.0.0"
internal_port = 10418

[sqlite]
file_path = "/etc/ainari/hanami_db"

# the password is read from the env-variable AINARI_MYSQL_PASSWORD
#[mysql]
#host = "127.0.0.1"
#port = 3306
#user = "hanami"
#database = "hanami"

[miko]
address = "http://127.0.0.1:11417"

[network]
# range of the floating ip-addresses, which are handed out to the virtual machines
floating_ip_cidr = "10.0.0.0/24"
# encrypt the traffic between the virtual machines of a network on different hosts with IPsec,
# whose keys are exchanged by the gateways over MLS-groups and the izakaya
mls_encryption = true
# seconds, for which a membership-grant allows a torii to join the group of a network
mls_grant_validity = 86400
# seconds between two refreshes of all membership-grants, which also brings them back to izakaya,
# if it lost its database. Has to be shorter than mls_grant_validity.
mls_grant_refresh_interval = 300
