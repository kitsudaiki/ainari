debug = true
# "stdout" or "log_file", the log-file is written into log_path
log_type = "stdout"
log_path = "/var/log/"
# "sqlite" or "mysql", which selects the group below, which is used to connect to the database
database_type = "sqlite"
skip_tls_verification = true

[api]
public_ip = "0.0.0.0"
public_port = 11417
internal_ip = "0.0.0.0"
internal_port = 10417

[sqlite]
file_path = "/etc/ainari/miko_db"

# the password is read from the env-variable AINARI_MYSQL_PASSWORD
#[mysql]
#host = "127.0.0.1"
#port = 3306
#user = "miko"
#database = "miko"

[auth]
token_key_path = "/etc/ainari/token_key"
token_expire_time = 3600

[endpoints.hanami]
public_address = "http://127.0.0.1:11418"
internal_address = "http://127.0.0.1:10418"

[endpoints.ryokan]
public_address = "http://127.0.0.1:11416"
internal_address = "http://127.0.0.1:10416"

[endpoints.torii]
public_address = "http://127.0.0.1:11419"
internal_address = "http://127.0.0.1:10419"

[endpoints.omamori]
public_address = "http://127.0.0.1:11421"
internal_address = "http://127.0.0.1:10421"

[endpoints.izakaya]
public_address = "http://127.0.0.1:11423"
internal_address = "http://127.0.0.1:10423"
