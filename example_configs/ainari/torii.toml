debug = true
log_path = "/var/log"
skip_tls_verification = true

[api]
public_ip = "0.0.0.0"
public_port = 11419
internal_ip = "0.0.0.0"
internal_port = 10419

[database]
file_path = "/etc/ainari/torii_db"

[miko]
address = "http://127.0.0.1:11417"

[ports]
min_port = 10042
max_port = 10053
# address, which the proxies listen on. Defaults to api.public_ip
# listen_ip = "0.0.0.0"

[network]
overlay_iface = "veth-gw"
underlay_iface = "eth0"
